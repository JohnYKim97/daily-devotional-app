<div class="settings-page px-4 py-4">
  <h1 class="settings-title">Settings</h1>

  <section class="settings-card">
    <div class="settings-row">
      <div class="settings-row-text">
        <span class="settings-row-title">Show favorite verse in Notes</span>
        <p class="settings-row-desc">Display the favorite verse picker in the Notes panel.</p>
      </div>

      <button
        type="button"
        class="settings-toggle"
        [class.settings-toggle-on]="settingsService.showFavoriteVerseInNotes()"
        [attr.aria-pressed]="settingsService.showFavoriteVerseInNotes()"
        aria-label="Show favorite verse in Notes"
        (click)="toggleShowFavoriteVerse()"
      >
        <span class="settings-toggle-thumb"></span>
      </button>
    </div>
  </section>

  <section class="settings-card">
    <div class="settings-row">
      <div class="settings-row-text">
        <span class="settings-row-title">Theme</span>
        <p class="settings-row-desc">Choose how Daily Devotional looks</p>
      </div>

      <div class="settings-segmented" role="radiogroup" aria-label="Theme">
        @for (option of themeOptions; track option.value) {
          <button
            type="button"
            role="radio"
            class="settings-segment"
            [class.settings-segment-active]="settingsService.theme() === option.value"
            (click)="settingsService.setTheme(option.value)"
          >
            {{ option.label }}
          </button>
        }
      </div>
    </div>
  </section>
</div>
