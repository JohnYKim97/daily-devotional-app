<div
  class="journal-container"
  [style.--sheet-height]="sheetHeightPx() + 'px'"
  [class.dragging]="isDragging()"
>
  <div
    class="sheet-drag-area d-md-none"
    (pointerdown)="onDragStart($event)"
    (pointermove)="onDragMove($event)"
    (pointerup)="onDragEnd()"
    (pointercancel)="onDragEnd()"
  >
    <div class="sheet-handle"></div>
    <div class="d-flex align-items-center justify-content-between">
      <span class="journal-title">Notes</span>
      <button
        type="button"
        class="sheet-toggle"
        (click)="toggleSheet()"
        [attr.aria-expanded]="isExpanded()"
        aria-label="Expand or collapse notes"
      >
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          [class.flipped]="isExpanded()"
        >
          <path d="M18 15l-6-6-6 6" />
        </svg>
      </button>
    </div>
  </div>

  <span class="journal-title d-none d-md-block">Notes</span>

  @if (settingsService.showFavoriteVerseInNotes()) {
    <section class="favorite-verse">
      <label for="favoriteVerse">Favorite verse</label>
      <select
        id="favoriteVerse"
        [ngModel]="selectedVerseNumber()"
        (ngModelChange)="selectedVerseNumber.set($event)"
      >
        <option [ngValue]="null">Select a verse</option>
        @for (verse of reading()?.verses ?? []; track verse.number) {
          <option [ngValue]="verse.number">Verse {{ verse.number }}</option>
        }
      </select>
      @if (selectedVerse) {
        <div class="selected-verse">
          <strong>{{ reading()?.book }} {{ reading()?.chapter }}:{{ selectedVerse.number }}</strong>
          <p>{{ selectedVerse.text }}</p>
        </div>
      }
    </section>
  }

  <section class="notes-section">
    <textarea
      [ngModel]="notes()"
      (ngModelChange)="notes.set($event)"
      maxlength="10000"
      placeHolder="Write your thoughts about today's reading..."
    ></textarea>
    <div class="character-count">{{ notes().length }}/10,000</div>
  </section>

  <button type="button" class="save-btn" (click)="saveJournal()">
    {{ saved() ? 'Saved!' : 'Save' }}
  </button>
</div>
