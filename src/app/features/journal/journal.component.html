<div class="journal-container">
  <span class="journal-title">Notes</span>

  <section class="favorite-verse">
    <label for="favoriteVerse">Favorite verse</label>
    <select id="favoriteVerse [(ngModel)]=selectedVerseNumber">
      <option [ngValue]="null">Select a verse</option>
      @for (verse of reading()?.verses ?? []; track verse.number) {
        <option [ngValue]="verse.number">Verse {{ verse.number }}</option>
      }
    </select>
    @if (selectedVerse) {
      <div class="selected-verse">
        <strong>{{ reading()?.book }} {{ reading()?.chapter }}:{{ selectedVerse.number }}</strong>
        <p>{{ selectedVerse.text }}</p>
      </div>
    }
  </section>

  <section class="notes-section">
    <textarea
      [(ngModel)]="notes"
      maxlength="2000"
      placeholder="Write your thoughts about today's reading..."
    ></textarea>
    <div class="character-count">{{ notes.length }} / 2000</div>
  </section>

  <button type="button" class="save-btn" (click)="saveJournal()">Save</button>
  @if (saved) {
    <p class="save-message">Saved</p>
  }
</div>
