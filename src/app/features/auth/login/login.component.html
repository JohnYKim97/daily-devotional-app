<div class="d-flex align-items-center justify-content-center login-page">
  <div class="d-flex flex-column align-items-center gap-4 login-card">
    <div class="d-flex flex-column align-items-center gap-3">
      <svg
        width="38"
        height="38"
        viewBox="0 0 24 24"
        fil="none"
        stroke-width="1.7"
        class="brand-icon"
      >
        <path
          d="M2 5.5C2 4.4 3.1 3.9 4.6 3.9c2.1 0 4.1.8 5.4 2v13.4c-1.3-1.2-3.3-1.9-5.4-1.9-1.5 0-2.6.4-2.6 1.3"
        />
        <path
          d="M22 5.5c0-1.1-1.1-1.6-2.6-1.6-2.1 0-4.1.8-5.4 2v13.4c1.3-1.2 3.3-1.9 5.4-1.9 1.5 0 2.6.4 2.6 1.3"
        />
      </svg>

      <div class="text-center">
        <div class="brand-title">Daily Devotional</div>
        <p class="brand-tagline">A quiet moment with Scripture,<br />every day.</p>
      </div>
    </div>

    <button
      class="button"
      class="d-flex align-items-center justify-content-center gap-2 google-btn"
      (click)="authService.loginWithGoogle()"
    >
      <svg width="18" height="18" viewBox="0 0 18 18">
        <path
          fill="#4285F4"
          d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"
        />
        <path
          fill="#34A853"
          d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"
        />
        <path
          fill="#FBBC05"
          d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A9 9 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"
        />
        <path
          fill="#EA4335"
          d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.167 6.656 3.58 9 3.58z"
        />
      </svg>
      Continue with Google
    </button>

    <p class="text-center privacy-note">
      Used only to save your reading history and journal privately. We never post on your behalf.
    </p>
  </div>
</div>
