<div class="dashboard-page">
  <div class="d-flex align-items-center justify-content-center gap-3 date-nav">
    <button
      type="button"
      class="date-nav-arrow"
      (click)="dateService.previousDay()"
      aria-label="Previous day"
    >
      ←
    </button>
    <div class="d-flex align-items-center gap-2">
      <svg
        class="date-icon"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke-width="2"
      >
        <rect x="3" y="5" width="18" height="16" rx="2" />
        <path d="M3 10h18M8 3v4M16 3v4" />
      </svg>
      <span class="date-display">{{ selectedDate() | date: 'MMMM d, yyy' }}</span>
    </div>
    <button
      type="button"
      class="date-nav-arrow"
      (click)="dateService.nextDay()"
      aria-label="Next day"
    >
      →
    </button>
  </div>

  <div class="d-flex gap-4 dashboard-panels">
    <section class="reading-panel">
      <app-reading></app-reading>
    </section>

    <section class="notes-panel">
      <app-journal></app-journal>
    </section>
  </div>
</div>
