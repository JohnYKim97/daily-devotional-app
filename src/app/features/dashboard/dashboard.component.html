  <h1>{{ selectedDate() | date: 'MMMM d, yyyy' }}</h1>
  <button type="button" (click)="dateService.nextDay()">→</button>
</div>

  <section class="right-panel">
    <app-journal></app-journal>
  </section>
</div>
