<div class="dashboard-page">
  <button
    type="button"
    class="day-nav-edge day-nav-edge-prev"
    (click)="dateService.previousDay()"
    aria-label="Previous day"
  >
    <svg
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M15 6l-6 6 6 6" />
    </svg>
  </button>

  <button
    type="button"
    class="day-nav-edge day-nav-edge-next"
    (click)="dateService.nextDay()"
    aria-label="Next day"
  >
    <svg
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M9 6l6 6-6 6" />
    </svg>
  </button>

  <app-date-nav class="d-md-none dashboard-date-nav" />

  <div class="d-flex gap-4 dashboard-panels">
    <section class="reading-panel">
      <app-reading></app-reading>
    </section>

    <section class="notes-panel">
      <app-journal></app-journal>
    </section>
  </div>
</div>
