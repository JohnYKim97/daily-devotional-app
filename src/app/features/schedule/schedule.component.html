<div class="schedule-page">
  <div class="page-header">
    <div>
      <h1>Reading Schedule</h1>
      <p>Your full plan, one day at a time.</p>
    </div>
    <button type="button" class="jump-button" (click)="scrollToToday()">Jump to today</button>
  </div>

  @if (groupedSchedule().length === 0) {
    <p class="empty-state">No reading schedule has been imported yet.</p>
  }

  @for (group of groupedSchedule(); track group.month) {
    <div class="month-label">{{ group.month }}</div>

    <div class="entries">
      @for (entry of group.entries; track entry.id) {
        <button
          type="button"
          class="entry-[ariaRowSpan]="
          [class.today]="status(entry) === 'today'"
          [id]="status(entry) === 'today' ? 'today-schedule-entry' : null"
          (click)="goToDate(entry.date)"
        >
          <div class="entry-date-block" [class.muted]="status(entry) !== 'today'">
            <div class="day-number">{{ entry.date | date: 'd' }}</div>
            <div class="day-name">{{ entry.date | date: 'EEE' }}</div>
          </div>

          <div class="entry-passage" [class.muted]="status(entry) === 'future'">
            {{ passageReference(entry) }}
          </div>

          @if (status(entry) === 'today') {
            <span class="today-badge">Today</span>
          } @else if (status(entry) === 'past') {
            <svg
              class="done-icon"
              width="17"
              height="17"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="10" />
              <path
                class="done-icon-check"
                d="M8.5 12.5l2.3 2.3 5-5"
                stroke-width="2"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          } @else {
            <span class="upcoming-dot" aria-hidden="true"></span>
          }
        </button>
      }
    </div>
  }
</div>
