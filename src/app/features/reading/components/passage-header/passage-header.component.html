<div
  class="d-flex align-items-center justify-content-center justify-content-md-between gap-3 passage-header"
>
  <span class="passage-title"> (ESV) {{ passageReference() }} </span>

  <button
    type="button"
    class="commentary-toggle"
    [class.commentary-toggle-active]="commentaryExpanded()"
    (click)="toggleCommentary.emit()"
  >
    <svg
      width="12"
      height="12"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <path
        d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"
      />
    </svg>
    Commentary
  </button>
</div>
