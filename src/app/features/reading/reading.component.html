@if (loading()) {
  <div class="reading-loading">Loading reading...</div>
} @else if (error()) {
  <div class="reading-error">
    <h2>No reading available</h2>
    <p>There is no devotional reading available for this date.</p>
  </div>
} @else if (reading(); as currentReading) {
  <div class="reading-container">
    <app-passage-header
      [reading]="currentReading"
      [commentaryExpanded]="commentaryExpanded()"
      (toggleCommentary)="commentaryExpanded.set(!commentaryExpanded())"
    >
    </app-passage-header>

    <app-commentary [commentary]="currentReading.commentary" [expanded]="commentaryExpanded()">
    </app-commentary>

    <div class="verse-card">
      <app-verse-list [verses]="currentReading.verses"> </app-verse-list>
    </div>
  </div>
} @else {
  <div class="reading-loading">Loading today's reading...</div>
}
