name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run unit tests
        run: npx ng test --watch=false

      - name: Build
        run: npm run build

  backend:
    name: Backend (.NET API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/DailyDevotional.Api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DailyDevotional.Api.sln

      - name: Build
        run: dotnet build DailyDevotional.Api.sln -c Release --no-restore

      - name: Build Docker image
        run: docker build -t daily-devotional-api:ci .
